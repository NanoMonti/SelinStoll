# Admin-Panel (Decap CMS) für selinstoll.ch
# Selin meldet sich unter /admin/ an und ändert hier alle Texte der Webseite.
# Jede Änderung wird als Commit im GitHub-Repo gespeichert; Netlify
# veröffentlicht sie danach automatisch (ca. 1 Minute).

backend:
  name: git-gateway
  branch: main           # Live: Änderungen erscheinen direkt auf selinstoll.ch

# Nur auf localhost aktiv (Test mit "npx decap-server"); online ohne Wirkung.
local_backend: true

locale: de
site_url: https://selinstoll.ch
display_url: https://selinstoll.ch

# Bilder, die Selin hochlädt (z. B. ihr Porträt)
media_folder: Selin/bilder
public_folder: /bilder

collections:
  - name: seite
    label: Webseite
    editor:
      preview: false
    files:
      - name: inhalt
        label: Alle Texte der Webseite
        file: Selin/inhalt.json
        format: json
        fields:
          - label: Kursdaten
            name: daten
            widget: object
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - { label: Kurstermine, name: kurstermine, widget: string, hint: "z. B. 2. März – 20. April 2027" }
              - { label: Tag der Achtsamkeit (Datum), name: tag, widget: string, hint: "z. B. 10. April 2027" }
              - { label: Ort, name: ort, widget: string }
              - { label: Gruppe, name: gruppe, widget: string }
              - { label: Kosten, name: kosten, widget: string }
              - { label: Text zum Tag der Achtsamkeit, name: tag_text, widget: text }
              - { label: Text des Karten-Links, name: karte_text, widget: string }
              - { label: Google-Maps-Link, name: karte_link, widget: string }
              - label: Beschriftungen der Kästchen
                name: beschriftungen
                widget: object
                collapsed: true
                fields:
                  - { label: Kurstermine, name: kurstermine, widget: string }
                  - { label: Tag der Achtsamkeit, name: tag, widget: string }
                  - { label: Ort, name: ort, widget: string }
                  - { label: Gruppe, name: gruppe, widget: string }
                  - { label: Kosten, name: kosten, widget: string }

          - label: Knopf unter den Kursdaten
            name: buchen
            widget: object
            collapsed: true
            fields:
              - { label: Text des Knopfs, name: knopf, widget: string }

          - label: Startbereich (oben)
            name: start
            widget: object
            collapsed: true
            fields:
              - { label: Grosser Titel (auf dem Bild), name: titel, widget: string }

          - label: Was ist MBSR?
            name: kurs
            widget: object
            collapsed: true
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - label: Absätze
                name: absaetze
                widget: list
                field: { label: Absatz, name: absatz, widget: text }
              - { label: Überschrift «Was wir üben», name: elemente_titel, widget: string }
              - label: Was wir üben
                name: elemente
                widget: list
                field: { label: Punkt, name: punkt, widget: string }
              - { label: Überschrift «Für wen», name: fuer_wen_titel, widget: string }
              - label: Für wen ist der Kurs?
                name: fuer_wen
                widget: list
                field: { label: Punkt, name: punkt, widget: string }
              - { label: Hinweis (klein), name: hinweis, widget: text }

          - label: Kursleitung / Über mich
            name: leitung
            widget: object
            collapsed: true
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Ausbildung / Qualifikation, name: rolle, widget: string }
              - { label: Foto, name: foto, widget: image, required: false, choose_url: false }
              - { label: Bildbeschreibung (für Screenreader), name: foto_alt, widget: string }
              - { label: Überschrift «Wer ich bin», name: wer_titel, widget: string }
              - label: Text «Wer ich bin»
                name: wer_text
                widget: list
                field: { label: Absatz, name: absatz, widget: text }

          - label: Seite «Kurs buchen» (Anmeldeformular)
            name: anmeldung
            widget: object
            collapsed: true
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Bedingungen
                name: bedingungen
                widget: list
                field: { label: Bedingung, name: bedingung, widget: text }
              - label: Formular-Beschriftungen
                name: formular
                widget: object
                collapsed: true
                fields:
                  - { label: Vorname, name: vorname, widget: string }
                  - { label: Nachname, name: nachname, widget: string }
                  - { label: Geburtsdatum, name: geburtsdatum, widget: string }
                  - { label: Telefon, name: telefon, widget: string }
                  - { label: Strasse und Nr., name: strasse, widget: string }
                  - { label: PLZ, name: plz, widget: string }
                  - { label: Ort, name: ort, widget: string }
                  - { label: E-Mail, name: email, widget: string }
                  - { label: Frage nach dem Kontaktweg, name: kontaktweg, widget: string }
                  - label: Kontaktwege zur Auswahl
                    name: kontaktweg_optionen
                    widget: list
                    field: { label: Kontaktweg, name: weg, widget: string }
                  - { label: Nachricht, name: nachricht, widget: string }
                  - { label: Zustimmung (Häkchen), name: zustimmung, widget: string }
                  - { label: Text des Knopfs, name: knopf, widget: string }

          - label: Seite «Danke» nach der Anmeldung
            name: danke
            widget: object
            collapsed: true
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Text zum Termin, name: termin_text, widget: text }
              - { label: Text des Termin-Knopfs, name: termin_knopf, widget: string }
              - { label: Link zur Terminbuchung (z. B. Calendly), name: termin_link, widget: string, required: false, hint: "Leer lassen, solange es keinen Link gibt – dann erscheint der Text darunter." }
              - { label: Text, solange es keinen Termin-Link gibt, name: ohne_link, widget: text }
              - { label: Link «Zurück zur Startseite», name: zurueck, widget: string }

          - label: Kontakt (unten) und Danke-Seite
            name: kontakt
            widget: object
            collapsed: true
            fields:
              - { label: Überschrift, name: titel, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Formular-Beschriftungen
                name: formular
                widget: object
                collapsed: true
                fields:
                  - { label: Vorname, name: vorname, widget: string }
                  - { label: Nachname, name: nachname, widget: string }
                  - { label: E-Mail, name: email, widget: string }
                  - { label: Telefon, name: telefon, widget: string }
                  - { label: Thema, name: thema, widget: string }
                  - { label: Nachricht, name: nachricht, widget: string }
                  - { label: Text des Knopfs, name: knopf, widget: string }
              - { label: Danke-Seite – Überschrift, name: danke_titel, widget: string }
              - { label: Danke-Seite – Text, name: danke_text, widget: text }

          - label: Kopfzeile und Menü
            name: kopf
            widget: object
            collapsed: true
            fields:
              - { label: Kleine Zeile über dem Titel, name: untertitel, widget: string }
              - label: Menü
                name: navigation
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: Ziel (nicht ändern), name: ziel, widget: string }

          - label: Google / Browser-Tab
            name: seite
            widget: object
            collapsed: true
            fields:
              - { label: Titel, name: titel, widget: string }
              - { label: Beschreibung, name: beschreibung, widget: text }

          - label: Fusszeile
            name: fuss
            widget: object
            collapsed: true
            fields:
              - { label: Text, name: text, widget: string }
              - { label: Impressum (Linktext), name: impressum, widget: string }
              - { label: Datenschutz (Linktext), name: datenschutz, widget: string }
