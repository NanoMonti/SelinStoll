<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selin Stoll – MBSR</title>
<meta name="description" content="">
<style>
  :root {
    --bg: #ffffff; --text: #1f2a2e; --muted: #67757a; --accent: #1f5a63; --soft: #eef4f3; --line: #e2e8e7;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--sans); }
  a { color: var(--accent); }
  mark.offen { background: #fff1a8; color: inherit; padding: 0 .2em; border-radius: 3px; }

  .layout { display: grid; grid-template-columns: 44% 1fr; }
  .bild { position: sticky; top: 0; height: 100vh; background: url(bilder/meer-hoch.jpg) center/cover; }
  .inhalt { padding: 48px clamp(16px, 6vw, 88px) 40px; max-width: 760px; }
  .kopf { display: flex; justify-content: flex-end; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18vh; }
  .kopf .name { font-weight: 700; letter-spacing: .04em; }
  .kopf nav { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; }
  .kopf nav a { color: var(--muted); text-decoration: none; }
  .label { text-transform: uppercase; letter-spacing: .2em; font-size: 12px; color: var(--accent); margin: 0 0 12px; font-weight: 600; }
  h1 { font-size: clamp(36px, 4.6vw, 56px); line-height: 1.1; margin: 0 0 18px; font-weight: 300; letter-spacing: -.01em; }
  .lead { font-size: 19px; color: var(--muted); margin: 0 0 28px; max-width: 34em; }
  .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 4px; border: 0; font: 600 15px var(--sans); cursor: pointer; }
  section { padding-top: 88px; }
  h2 { font-size: 28px; font-weight: 300; margin: 0 0 18px; }
  h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; margin: 28px 0 8px; color: var(--muted); }
  ul { padding-left: 1.1em; } li { margin: 3px 0; }
  .hinweis { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
  .box { background: var(--soft); padding: 24px; border-radius: 6px; }
  .zeitraum { font-size: 24px; font-weight: 300; margin: 0 0 12px; }
  dl { margin: 0; } dl div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid #d5e2e0; }
  dl div:last-child { border-bottom: 0; } dt { color: var(--muted); } dd { margin: 0; text-align: right; }
  .leitung { display: flex; gap: 22px; align-items: center; margin-bottom: 8px; }
  .foto { flex: 0 0 96px; height: 96px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 12px; color: var(--muted); text-align: center; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .leitung p { margin: 0; color: var(--muted); }
  .leitung strong { font-size: 18px; display: block; color: var(--text); }
  form { display: grid; gap: 12px; margin-top: 20px; }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea { font: 16px var(--sans); padding: 10px 0; border: 0; border-bottom: 1px solid #b9c7c5; background: transparent; color: var(--text); border-radius: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-bottom-color: var(--accent); }
  label.check { display: flex; gap: 10px; align-items: flex-start; color: var(--text); font-size: 14px; margin-top: 6px; }
  label.check input { margin-top: 5px; }
  form .btn { justify-self: start; margin-top: 6px; }
  footer { margin-top: 96px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .bild { position: relative; height: 46vh; }
    .kopf { margin-bottom: 40px; }
    .zwei { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="bild" role="img" aria-label="Klares Meerwasser über Steinen"></div>
  <div class="inhalt">
    <div class="kopf">
      <nav data-nav="kopf.navigation"></nav>
    </div>

    <p class="label" data-t="kopf.untertitel"></p>
    <h1 data-t="start.titel"></h1>
    <p class="lead"><span data-t="start.text"></span><br><strong data-t="daten.kurstermine" style="color:var(--text);font-weight:600"></strong></p>
    <a class="btn" href="#anmeldung" data-t="start.knopf"></a>

    <section id="kurs">
      <h2 data-t="kurs.titel"></h2>
      <div data-ps="kurs.absaetze"></div>
      <h3 data-t="kurs.elemente_titel"></h3>
      <ul data-list="kurs.elemente"></ul>
      <h3 data-t="kurs.fuer_wen_titel"></h3>
      <ul data-list="kurs.fuer_wen"></ul>
      <p class="hinweis" data-t="kurs.hinweis"></p>
    </section>

    <section id="daten">
      <h2 data-t="daten.titel"></h2>
      <div class="box">
        <dl>
          <div><dt data-t="daten.beschriftungen.kurstermine"></dt><dd data-t="daten.kurstermine"></dd></div>
          <div><dt data-t="daten.beschriftungen.tag"></dt><dd data-t="daten.tag"></dd></div>
          <div><dt data-t="daten.beschriftungen.ort"></dt><dd><span data-t="daten.ort"></span><br><a data-href="daten.karte_link" data-t="daten.karte_text" target="_blank" rel="noopener"></a></dd></div>
          <div><dt data-t="daten.beschriftungen.gruppe"></dt><dd data-t="daten.gruppe"></dd></div>
          <div><dt data-t="daten.beschriftungen.kosten"></dt><dd data-t="daten.kosten"></dd></div>
        </dl>
      </div>
      <p class="hinweis" style="margin-top:18px" data-t="daten.tag_text"></p>
    </section>

    <section id="leitung">
      <h2 data-t="leitung.titel"></h2>
      <div class="leitung">
        <div class="foto" data-foto="leitung.foto">Foto<br>folgt</div>
        <p><strong data-t="leitung.name"></strong><span data-t="leitung.rolle"></span></p>
      </div>
      <h3 data-t="leitung.wer_titel"></h3>
      <div data-ps="leitung.wer_text"></div>
    </section>

    <section id="anmeldung">
      <h2 data-t="anmeldung.titel"></h2>
      <p data-t="anmeldung.text"></p>
      <ul data-list="anmeldung.bedingungen"></ul>
      <form name="anmeldung" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <p hidden><label>Nicht ausfüllen: <input name="bot-field"></label></p>
        <div class="zwei">
          <label><span data-t="anmeldung.formular.vorname"></span><input name="vorname" required autocomplete="given-name"></label>
          <label><span data-t="anmeldung.formular.nachname"></span><input name="nachname" required autocomplete="family-name"></label>
        </div>
        <div class="zwei">
          <label><span data-t="anmeldung.formular.email"></span><input name="email" type="email" required autocomplete="email"></label>
          <label><span data-t="anmeldung.formular.telefon"></span><input name="telefon" type="tel" autocomplete="tel"></label>
        </div>
        <label><span data-t="anmeldung.formular.kurs"></span><select name="kurs" data-opts="anmeldung.formular.kurs_optionen"></select></label>
        <label><span data-t="anmeldung.formular.nachricht"></span><textarea name="nachricht" rows="2"></textarea></label>
        <label class="check"><input type="checkbox" name="zustimmung" value="ja" required><span data-t="anmeldung.formular.zustimmung"></span></label>
        <button class="btn" type="submit" data-t="anmeldung.formular.knopf"></button>
      </form>
    </section>

    <section id="kontakt">
      <h2 data-t="kontakt.titel"></h2>
      <p data-t="kontakt.text"></p>
      <p data-t="kontakt.email"></p>
    </section>

    <footer>
      <span data-t="fuss.text"></span>
      <a href="#" data-t="fuss.impressum"></a>
      <a href="#" data-t="fuss.datenschutz"></a>
    </footer>
  </div>
</div>
<script src="inhalt.js"></script>
</body>
</html>
