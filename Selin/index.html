<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entwurf – selinstoll.ch</title>
<style>
  body { margin: 0; background: #faf8f5; color: #283231; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 520px; padding: 24px 16px; }
  h1 { font: normal 30px Georgia, serif; margin: 0 0 8px; }
  p { color: #6b7573; }
  a { display: block; padding: 14px 18px; margin: 10px 0; background: #fff; border: 1px solid #e7e0d5; border-radius: 8px; color: #3d7a74; text-decoration: none; font-weight: 600; }
  a.admin { background: #3d7a74; color: #fff; border-color: #3d7a74; }
</style>
</head>
<body>
<main>
  <h1>Entwurf der neuen Webseite</h1>
  <p>Drei Varianten mit denselben Texten. Änderungen im Admin erscheinen in allen drei.</p>
  <a href="/variante-1.html">Variante 1 – Ruhig</a>
  <a href="/variante-2.html">Variante 2 – Geteilt</a>
  <a href="/variante-3.html">Variante 3 – Karten</a>
  <a class="admin" href="/admin/">Texte bearbeiten (Admin)</a>
</main>
<script>
  // Links aus Netlify-Identity-E-Mails (Einladung, Passwort zurücksetzen)
  if (/(invite|recovery|confirmation|email_change)_token=/.test(location.hash)) {
    var s = document.createElement('script');
    s.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
    s.onload = function () { window.netlifyIdentity.on('login', function () { location.href = '/admin/'; }); };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
