<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selin Stoll – MBSR</title>
<meta name="description" content="">
<link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<header class="top wrap">
  <nav data-nav="kopf.navigation"></nav>
</header>

<div class="band">
  <div class="wrap">
    <p data-t="kopf.untertitel"></p>
    <h1 data-t="start.titel"></h1>
  </div>
</div>

<main class="wrap">
  <section id="kurs">
    <div class="zwei">
      <div>
        <h2 data-t="kurs.titel"></h2>
        <div data-ps="kurs.absaetze"></div>
        <p class="hinweis" data-t="kurs.hinweis"></p>
      </div>
      <div class="seite">
        <h3 data-t="kurs.elemente_titel"></h3>
        <ul data-list="kurs.elemente"></ul>
        <h3 data-t="kurs.fuer_wen_titel"></h3>
        <ul data-list="kurs.fuer_wen"></ul>
      </div>
    </div>
  </section>

  <section id="daten">
    <h2 data-t="daten.titel"></h2>
    <dl>
      <div><dt data-t="daten.beschriftungen.kurstermine"></dt><dd data-t="daten.kurstermine"></dd></div>
      <div><dt data-t="daten.beschriftungen.tag"></dt><dd data-t="daten.tag"></dd></div>
      <div><dt data-t="daten.beschriftungen.ort"></dt><dd><span data-t="daten.ort"></span><br><a data-href="daten.karte_link" data-t="daten.karte_text" target="_blank" rel="noopener"></a></dd></div>
      <div><dt data-t="daten.beschriftungen.gruppe"></dt><dd data-t="daten.gruppe"></dd></div>
      <div><dt data-t="daten.beschriftungen.kosten"></dt><dd data-t="daten.kosten"></dd></div>
      <div class="tagtext"><dd data-t="daten.tag_text"></dd></div>
    </dl>
    <p class="buchen"><a class="btn gross" href="/anmeldung.html" data-t="buchen.knopf"></a></p>
  </section>

  <section id="leitung">
    <div class="leitung">
      <div class="foto" data-foto="leitung.foto">Foto folgt</div>
      <div>
        <h2 data-t="leitung.titel"></h2>
        <p><strong data-t="leitung.name"></strong></p>
        <p class="rolle" data-t="leitung.rolle"></p>
        <h3 data-t="leitung.wer_titel"></h3>
        <div data-ps="leitung.wer_text"></div>
      </div>
    </div>
  </section>

  <section id="kontakt">
    <div class="kontakt">
      <div>
        <h2 data-t="kontakt.titel"></h2>
        <p data-t="kontakt.text"></p>
      </div>
      <form name="kontakt" method="POST" action="/kontakt-danke.html" data-netlify="true" netlify-honeypot="bot-field">
        <p hidden><label>Nicht ausfüllen: <input name="bot-field"></label></p>
        <label><span data-t="kontakt.formular.vorname"></span><input name="vorname" required autocomplete="given-name"></label>
        <label><span data-t="kontakt.formular.nachname"></span><input name="nachname" required autocomplete="family-name"></label>
        <label><span data-t="kontakt.formular.email"></span><input name="email" type="email" required autocomplete="email"></label>
        <label><span data-t="kontakt.formular.telefon"></span><input name="telefon" type="tel" autocomplete="tel"></label>
        <label class="ganz"><span data-t="kontakt.formular.nachricht"></span><textarea name="nachricht" rows="4" required></textarea></label>
        <button class="btn" type="submit" data-t="kontakt.formular.knopf"></button>
      </form>
    </div>
  </section>
</main>

<footer class="wrap">
  <span data-t="fuss.text"></span>
  <span><a href="#" data-t="fuss.impressum"></a><a href="#" data-t="fuss.datenschutz"></a></span>
</footer>
<script src="/inhalt.js"></script>
</body>
</html>
